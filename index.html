<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등학생 오징어 게임</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- 상단 점수판 -->
        <header id="score-board">
            <div class="team-score a-team">A팀: <span id="score-a">0</span></div>
            <div class="timer" id="global-timer">00:00</div>
            <div class="team-score b-team">B팀: <span id="score-b">0</span></div>
        </header>

        <main id="game-container">
            <!-- 인트로 화면 -->
            <section id="screen-intro" class="screen active">
                <div class="content">
                    <h1>SQUID GAME</h1>
                    <p class="subtitle">교실에서 즐기는 오징어 게임</p>
                    <button class="btn-start" onclick="game.showScreen('screen-team-select')">게임 시작</button>
                </div>
            </section>

            <!-- 팀 선택 화면 -->
            <section id="screen-team-select" class="screen">
                <div class="content">
                    <h2>팀을 선택하세요</h2>
                    <div class="team-buttons">
                        <button class="btn-team a" onclick="game.selectTeam('A')">A팀</button>
                        <button class="btn-team b" onclick="game.selectTeam('B')">B팀</button>
                    </div>
                </div>
            </section>

            <!-- 라운드 1: 무궁화 꽃이 피었습니다 -->
            <section id="screen-round1" class="screen">
                <div class="content">
                    <h2>ROUND 1</h2>
                    <h3>무궁화 꽃이 피었습니다</h3>
                    <div class="game-area">
                        <div class="doll-status" id="doll-status">🙈</div>
                        <div class="progress-container">
                            <div class="progress-bar" id="r1-progress"></div>
                        </div>
                        <button class="btn-action" id="btn-run" onmousedown="game.r1_run()" ontouchstart="game.r1_run()">달리기!!</button>
                    </div>
                </div>
            </section>

            <!-- 라운드 2: 달고나 떼기 -->
            <section id="screen-round2" class="screen">
                <div class="content">
                    <h2>ROUND 2</h2>
                    <h3>달고나 떼기</h3>
                    <div class="canvas-container">
                        <canvas id="dalgona-canvas" width="400" height="400"></canvas>
                        <div id="round2-timer">40</div>
                    </div>
                </div>
            </section>

            <!-- 라운드 3: 줄다리기 -->
            <section id="screen-round3" class="screen">
                <div class="content">
                    <h2>ROUND 3</h2>
                    <h3>줄다리기</h3>
                    <div class="tug-of-war-area">
                        <div class="rope-options">
                            <div class="rope" onclick="game.selectRope(1)">줄 1</div>
                            <div class="rope" onclick="game.selectRope(2)">줄 2</div>
                            <div class="rope" onclick="game.selectRope(3)">줄 3</div>
                            <div class="rope" onclick="game.selectRope(4)">줄 4</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 결과 화면 -->
            <section id="screen-result" class="screen">
                <div class="content">
                    <h2 id="result-title">생존!</h2>
                    <p id="result-msg">축하합니다. 팀 점수가 올라갔습니다.</p>
                    <button class="btn-start" onclick="game.showScreen('screen-team-select')">다음 도전자</button>
                </div>
            </section>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
